name: Dip-X scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dipx-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scanner/run.js
      - name: Commit state
        run: |
          git config user.name "dipx-bot"
          git config user.email "dipx-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
